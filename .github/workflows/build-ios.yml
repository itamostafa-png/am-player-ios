name: Build iOS app (IPA)

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack app files
        run: unzip -o app-files.zip

      - name: Install Capacitor
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Add VLC player engine (plays MKV and every format inside the app)
        run: |
          cp resources/ios/VlcPlayerPlugin.swift resources/ios/MainViewController.swift ios/App/App/
          cp resources/ios/add_files.js ./add_files.js
          npm install --no-save xcode@3
          node add_files.js
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          sed -i '' "s/  # Add your Pods here/  pod 'MobileVLCKit', '~> 3.6.0'/" ios/App/Podfile
          grep -n "MobileVLCKit" ios/App/Podfile
          grep -n "MainViewController" ios/App/App/Base.lproj/Main.storyboard

      - name: Allow HTTP streams, name, icon, splash
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AM Player" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string AM Player" "$P"
          # landscape only (iPhone + iPad)
          for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$K" "$P" || true
            /usr/libexec/PlistBuddy -c "Add :$K array" "$P"
            /usr/libexec/PlistBuddy -c "Add :$K:0 string UIInterfaceOrientationLandscapeLeft" "$P"
            /usr/libexec/PlistBuddy -c "Add :$K:1 string UIInterfaceOrientationLandscapeRight" "$P"
          done
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$P"
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do cp resources/icon-1024.png "$f"; done
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp resources/splash-2732.png "$f"; done || true

      - name: Copy web app
        run: npx cap sync ios

      - name: Install native libraries (VLC)
        run: cd ios/App && pod install --repo-update

      - name: Build unsigned IPA
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../AM-Player.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AM-Player-iOS
          path: AM-Player.ipa
