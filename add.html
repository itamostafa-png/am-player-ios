<title>AM Player · Add server</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: radial-gradient(circle at 50% 0%, #1d1912, #08080b 60%); color: #f3efe6;
    font-family: -apple-system, "Segoe UI", Roboto, Tahoma, Arial, sans-serif; display: flex; justify-content: center; padding: 24px 16px 40px; }
  .box { width: 100%; max-width: 440px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { width: 110px; height: 110px; }
  .lang { background: #1b1b22; color: #f3efe6; border: 0; border-radius: 20px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  h1 { font-size: 24px; margin: 14px 0 18px; color: #f1d78f; }
  label { display: block; font-size: 14px; color: #9a968c; margin: 12px 0 6px; }
  input { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 10px; border: 2px solid #2a2a33; background: #131318; color: #fff; outline: none; }
  input:focus { border-color: #d9b45a; }
  #code { font-size: 24px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
  .ltr { direction: ltr; text-align: left; }
  button.send { width: 100%; margin-top: 22px; padding: 15px; font-size: 18px; font-weight: 700; border: 0; border-radius: 10px; background: #d9b45a; color: #111; cursor: pointer; }
  button.send:disabled { opacity: .6; }
  .msg { margin-top: 16px; font-size: 16px; text-align: center; min-height: 24px; }
  .ok { color: #8fd18f; } .err { color: #ff7b6b; }
</style>

function $(id) { return document.getElementById(id); }
function apply() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  var els = document.querySelectorAll('[data-t]');
  for (var i = 0; i < els.length; i++) els[i].textContent = T[lang][els[i].getAttribute('data-t')];
  $('send').textContent = T[lang].send; $('lang').textContent = T[lang].other;
}
$('lang').onclick = function () { lang = lang === 'en' ? 'ar' : 'en'; try { localStorage.setItem('lang', lang); } catch (e) {} apply(); };
apply();
$('code').value = (location.hash || '').replace('#', '').toUpperCase();

function encode(obj, code) {
  var s = unescape(encodeURIComponent(JSON.stringify(obj))), out = '';
  for (var i = 0; i < s.length; i++) out += String.fromCharCode(s.charCodeAt(i) ^ code.charCodeAt(i % code.length));
  return 'AMP1:' + btoa(out);
}

$('f').onsubmit = function (e) {
  e.preventDefault();
  var code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  var msg = $('msg');
  if (code.length !== 8) { msg.className = 'msg err'; msg.textContent = T[lang].badcode; return; }
  var url = $('url').value.trim();
  if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
  var data = { name: $('name').value.trim(), url: url.replace(/\/+$/, ''), user: $('user').value.trim(), pass: $('pass').value.trim() };
  $('send').disabled = true; msg.className = 'msg'; msg.textContent = T[lang].sending;
  fetch('https://ntfy.sh/amplayer-' + code.toLowerCase(), { method: 'POST', body: encode(data, code) })
    .then(function (r) { if (!r.ok) throw new Error(r.status); msg.className = 'msg ok'; msg.textContent = T[lang].sent; })
    .catch(function () { msg.className = 'msg err'; msg.textContent = T[lang].fail; })
    .then(function () { $('send').disabled = false; });
};
</script>
</body>
</html>
